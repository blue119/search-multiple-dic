<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Enter a word to search...">
        <button id="search-button">Search</button>
    </div>
    <div class="grid-container">
        <div class="grid-item top-left">
            <div class="label">Urban Dictionary</div>
            <webview id="urban-webview" src="https://www.urbandictionary.com" allowpopups autosize></webview>
        </div>
        <div class="grid-item top-right">
            <div class="label">Cambridge Dictionary</div>
            <webview id="cambridge-webview" src="https://dictionary.cambridge.org/us/" allowpopups autosize></webview>
        </div>
        <div class="grid-item bottom-left">
            <div class="label">Merriam-Webster</div>
            <webview id="merriam-webview" src="https://www.merriam-webster.com" allowpopups autosize></webview>
        </div>
        <div class="grid-item bottom-right">
            <div class="label">Collins Dictionary</div>
            <webview id="collins-webview" src="https://www.collinsdictionary.com/us/" allowpopups autosize></webview>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
