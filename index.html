<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="split-container">
        <div class="pane top-pane">
            <webview id="dictionary-webview" src="https://www.dictionary.com"></webview>
        </div>
        <div class="pane bottom-pane">
            <webview id="merriam-webview" src="https://www.merriam-webster.com"></webview>
        </div>
    </div>
</body>
</html>
